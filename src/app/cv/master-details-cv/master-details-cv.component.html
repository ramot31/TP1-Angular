<div class="row mt-3">
  <div class="col-md-5">
    <div class="list-group">
      @for (cv of cvs(); track cv.id) {
        <a
          class="list-group-item list-group-item-action d-flex align-items-center gap-2"
          [routerLink]="[cv.id]"
          routerLinkActive="active"
        >
          <img
            class="rounded-circle"
            width="40"
            height="40"
            [src]="'assets/images/' + (cv.path | defaultImage)"
            [alt]="cv.name"
          />
          {{ cv.firstname }} {{ cv.name }}
        </a>
      } @empty {
        <div class="list-group-item text-muted">Aucun cv à afficher.</div>
      }
    </div>
  </div>

  <div class="col-md-7">
    <router-outlet (activate)="hasDetail.set(true)" (deactivate)="hasDetail.set(false)" />
    @if (!hasDetail()) {
      <div class="alert alert-light text-muted">
        Sélectionnez un cv dans la liste pour afficher son détail.
      </div>
    }
  </div>
</div>
