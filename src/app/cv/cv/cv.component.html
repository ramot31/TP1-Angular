<div class="row">
  <div class="col">
    <div class="alert alert-warning">
      {{ date | date : "full" | uppercase }}
    </div>
    <app-list [cvs]="cvs()"></app-list>
  </div>
  <div class="col">
    <app-cv-card [cv]="selectedCv()"></app-cv-card>
  </div>
</div>
@defer (on viewport; prefetch on idle) {
  <app-embauche />
} @placeholder {
  <div class="alert alert-light mt-2 text-muted">Liste des cv pré-embauchés</div>
} @loading (after 100ms; minimum 300ms) {
  <div class="alert alert-light mt-2 text-muted">Chargement des cv pré-embauchés...</div>
} @error {
  <div class="alert alert-danger mt-2">Impossible de charger la liste des cv pré-embauchés.</div>
}
