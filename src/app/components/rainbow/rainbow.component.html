<main class="rainbow-page">
  <section class="rainbow-hero">
    <div class="rainbow-badge">
      <span class="rainbow-badge__dot"></span>
      Directive interactive
    </div>
    <h1>Rainbow <span>Writer</span></h1>
    <p class="rainbow-intro">
      Écrivez une lettre et regardez votre texte changer de couleur,
      instantanément.
    </p>

    <div class="rainbow-card">
      <div class="rainbow-card__header">
        <div>
          <p class="eyebrow">Simulateur d’écriture</p>
          <h2>Votre message en couleurs</h2>
        </div>
        <div
          class="color-orb"
          [style.backgroundColor]="rainbow.color"
          [style.boxShadow]="'0 0 28px ' + rainbow.color"
          aria-hidden="true"
        ></div>
      </div>

      <label for="rainbow-input">Commencez à écrire</label>
      <input
        id="rainbow-input"
        appRainbow
        #rainbow="appRainbow"
        type="text"
        autocomplete="off"
        placeholder="Chaque touche révèle une nouvelle couleur..."
        aria-describedby="rainbow-help"
      />
      <p id="rainbow-help" class="rainbow-help">
        La couleur du texte et de la bordure est générée aléatoirement à
        chaque touche.
      </p>
      <div class="rainbow-spectrum" aria-hidden="true"></div>
    </div>
  </section>
</main>
